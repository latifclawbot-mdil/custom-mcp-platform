[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-http-transport"
version = "0.1.0"
description = "Reusable isolated authenticated MCP Streamable HTTP transport packaging"
requires-python = ">=3.11"
# Pinned exactly. This package is vendored into container images that are
# rebuilt rarely, so a silent minor bump of the MCP SDK must not be possible.
dependencies = [
    "mcp==2.3.0",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.1.0",
    "pytest-timeout==2.4.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
]

[project.scripts]
mcp-http-transport = "mcp_http_transport.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_http_transport"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 120
filterwarnings = [
    "error",
    # mcp 2.3.0 emits this for any AuthSettings without an explicit
    # validate_token_resource; we set it explicitly.
    "default::DeprecationWarning:mcp.*",
]