# Two containers, two distinct bearer tokens, no published ports.
#
# NETWORK TOPOLOGY (and the risk that comes with it)
# --------------------------------------------------
# The MCP servers have no `ports:` and no `hostname:`. Their only *host*
# consumer is LiteLLM, so they are attached to the same Docker network LiteLLM
# already uses — the external network named `coolify` (see the `networks:`
# block at the bottom). Each service is given a fixed alias on that network
# (`play-console-mcp`, `search-console-mcp`) so the gateway has a stable name
# to resolve regardless of which project created the container.
#
# Both services also stay on `mcp-internal`, a project-local bridge network
# used for nothing but keeping the two servers resolvable to each other for the
# health/isolation checks. Because they are now on a *shared* network with
# anything else attached to `coolify`, the earlier claim that the containers
# are reachable "only by service name inside mcp-internal" is no longer true
# and has been removed. The reachability boundary is now:
#
#   * no host port is published; host/network routing policy must still be
#     checked independently (a Docker bridge is not an access firewall);
#   * on the `coolify` network the endpoint is reachable by any container that
#     is also attached to it, addressed as <alias>:8080;
#   * the bearer token is still the only thing that authorises a request.
#
# Residual risk (accepted, documented in docs/security.md): every container on
# the `coolify` network can open a TCP connection to these services and attempt
# the endpoint. Without a token those attempts get 401. If that network is ever
# shared with an untrusted container, move these services to a dedicated
# network and attach only the gateway.
#
# THE TOKEN ALLOWLIST MUST MATCH THE ALIAS. MCP_HTTP_ALLOWED_HOSTS below lists
# exactly the alias each service answers to (plus loopback for the in-container
# healthcheck). A request whose Host header is anything else is rejected with
# 421, so a host alias that is not in the allowlist is a silently broken
# deployment — tests/test_deployment_artifacts.py asserts the two agree.
#
# SECRET FILE PERMISSIONS (important, and not something compose can fix)
# ----------------------------------------------------------------------
# The token and credential secrets use the `file:` driver. Compose delivers a
# `file:` secret with a **bind mount**, and bind mounts do not remap ownership
# or mode: the file arrives in the container with the *host file's* uid/gid and
# permission bits, exactly as they are on disk. Consequently the `uid`, `gid`
# and `mode` keys of a secret are ignored for a `file:` source, and setting
# them here would be a false promise. Instead the operator must make each host
# secret readable by the container user (uid/gid 10001). For a token file:
#
#   chown 10001:10001 /path/to/secret
#   chmod 0400        /path/to/secret
#
# A root-owned 0600 file is the natural thing to create and it fails for uid
# 10001 — the container exits at startup with a "cannot be read" error rather
# than serving an unauthenticated endpoint. This is verified by
# scripts/verify_secret_mount.sh and noted in docs/security.md.
#
# Build (from the repository root):
#   docker compose -f deploy/docker-compose.yml build
#
# Run (tokens and credentials are files outside the repository, one set per
# server; each host file must be readable by uid 10001 as described above):
#   PLAY_MCP_TOKEN_FILE=/run/host-secrets/play.token \
#   GSC_MCP_TOKEN_FILE=/run/host-secrets/gsc.token \
#   docker compose -f deploy/docker-compose.yml up -d
#
# The tokens must differ. Nothing in this file is a secret, and no Google
# identifier appears here: the allowlists and credential paths come from
# required variables / mounted secrets at run time.

name: custom-mcp

services:
  play-console-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.play-console
    image: custom-mcp/play-console:local
    restart: unless-stopped
    # No `ports:`. Reachable only by name from containers on the attached
    # networks; nothing is published on the host.
    expose:
      - "8080"
    environment:
      MCP_HTTP_PORT: "8080"
      MCP_HTTP_HOST: "0.0.0.0"
      MCP_HTTP_PATH: "/mcp"
      # The token is a mounted file, not an env var, so it does not show up in
      # `docker inspect` or in the process environment.
      MCP_HTTP_AUTH_TOKEN_FILE: "/run/secrets/play_mcp_token"
      # Explicit Host allowlist. This must contain the alias this service is
      # reachable under on the `coolify` network (the name LiteLLM calls), plus
      # loopback for the in-container healthcheck. No wildcard.
      MCP_HTTP_ALLOWED_HOSTS: "play-console-mcp,127.0.0.1"
      # Read by the server's own fail-closed startup check.
      PLAY_CONSOLE_ALLOWED_PACKAGES: "${PLAY_CONSOLE_ALLOWED_PACKAGES:?set the Play package allowlist}"
      PLAY_CONSOLE_CREDENTIALS_FILE: "/run/secrets/play_service_account.json"
      PLAY_CONSOLE_SUBJECT: "${PLAY_CONSOLE_SUBJECT:-}"
    secrets:
      - play_mcp_token
      - play_service_account.json
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    networks:
      # Stable aliases for the gateway. Keep these in sync with
      # MCP_HTTP_ALLOWED_HOSTS above.
      coolify:
        aliases:
          - play-console-mcp
      mcp-internal: {}
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(0 if s.connect_ex(('127.0.0.1',8080))==0 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  search-console-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.search-console
    image: custom-mcp/search-console:local
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      MCP_HTTP_PORT: "8080"
      MCP_HTTP_HOST: "0.0.0.0"
      MCP_HTTP_PATH: "/mcp"
      MCP_HTTP_AUTH_TOKEN_FILE: "/run/secrets/gsc_mcp_token"
      # Must match the alias below (the name LiteLLM calls).
      MCP_HTTP_ALLOWED_HOSTS: "search-console-mcp,127.0.0.1"
      GSC_ALLOWED_SITES: "${GSC_ALLOWED_SITES:?set the Search Console property allowlist}"
      GOOGLE_APPLICATION_CREDENTIALS: "/run/secrets/gsc_service_account.json"
      GSC_LOG_LEVEL: "INFO"
    secrets:
      - gsc_mcp_token
      - gsc_service_account.json
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    networks:
      # Stable alias for the gateway; keep in sync with MCP_HTTP_ALLOWED_HOSTS.
      coolify:
        aliases:
          - search-console-mcp
      mcp-internal: {}
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(0 if s.connect_ex(('127.0.0.1',8080))==0 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # The network LiteLLM is already on. Declared external so compose reads the
  # existing Docker network instead of trying to create one.
  coolify:
    external: true
    name: coolify
  # Project-local bridge, used for the east-west checks between the two servers.
  # Not `internal: true` because the servers still need Google egress.
  mcp-internal:
    driver: bridge
    attachable: false

# File-provided secrets. Provide the paths via the variables documented above;
# neither file may live inside this repository, and each host file must be
# readable by uid/gid 10001 (see the permissions note at the top).
#
# A `file:` secret is delivered as a bind mount, so `uid`/`gid`/`mode` keys
# would be ignored here; they are deliberately absent rather than set to values
# that would not take effect.
secrets:
  play_mcp_token:
    file: "${PLAY_MCP_TOKEN_FILE:?set PLAY_MCP_TOKEN_FILE to a file outside the repo}"
  gsc_mcp_token:
    file: "${GSC_MCP_TOKEN_FILE:?set GSC_MCP_TOKEN_FILE to a file outside the repo}"
  play_service_account.json:
    file: "${PLAY_SERVICE_ACCOUNT_FILE:?set PLAY_SERVICE_ACCOUNT_FILE to the mounted Play service-account JSON}"
  gsc_service_account.json:
    file: "${GSC_SERVICE_ACCOUNT_FILE:?set GSC_SERVICE_ACCOUNT_FILE to the mounted Search Console credential JSON}"