[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logto-ops-mcp"
version = "0.1.0"
description = "Write-capable, confirmation-gated MCP server for the Logto Management API"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp==2.3.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]
