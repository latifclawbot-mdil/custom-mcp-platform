[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "search-console-mcp"
version = "0.1.0"
description = "Read-only stdio MCP server for the Google Search Console API"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp==2.3.0",
  "google-auth==2.55.1",
  "requests==2.32.5",
]

[project.optional-dependencies]
# Test dependencies are optional; the requests transport is a runtime dependency.
test = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[project.scripts]
search-console-mcp = "search_console_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:search_console_mcp.*"]