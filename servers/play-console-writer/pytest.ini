[pytest]
pythonpath = src
testpaths = tests
asyncio_mode = auto
timeout = 180
filterwarnings =
    error
    default::DeprecationWarning:mcp.*
    # The MCP stdio client's event-loop transport can be garbage-collected after
    # its loop closes, which Python reports as an ignored exception during the
    # subprocess teardown. It is a test-harness artefact (SDK object lifetimes),
    # not a server behaviour; the assertions already passed. Pinned so the
    # `error` policy above still catches everything else.
    ignore:Exception ignored in.*:pytest.PytestUnraisableExceptionWarning