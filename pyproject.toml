[project]
name = "custom-mcp-platform-dev"
version = "0.0.0"
description = "Development environment for the two Google MCP servers plus the shared HTTP transport"
requires-python = ">=3.11"
# Exact pins. The containers install the same set through requirements.txt;
# this file exists so the test environment and the images cannot drift.
dependencies = [
    "mcp==2.3.0",
    "google-auth==2.55.1",
    "httpx==0.28.1",
    "requests==2.32.5",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "mcp-http-transport",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.1.0",
    "pytest-timeout==2.4.0",
    "respx==0.22.0",
    "pyyaml==6.0.3",
]

[tool.uv.sources]
mcp-http-transport = { path = "packages/mcp_http_transport", editable = true }

[tool.uv]
# The API surface changes between 2.x minors; uv must not upgrade it.
package = false